[versions]
# Should be equal to the Gradle embedded Kotlin version to prevent multiple Kotlin Compiler Daemon instances
kotlin = "2.3.20"
ktlint = "1.8.0"
coroutines = "1.10.2"
compose = "1.10.6"
sqlDelight = "2.4.1"
androidExtensions = "1.13.0"
androidXCore = "1.18.0"
appCompat = "1.8.0"
spotless = "8.4.0"
amvi = "0.9.1"
agp = "9.0.1"
vanniktechMavenPublish = "0.37.0"
kover = "0.9.11"
robolectric = "4.17"
junit4 = "4.13.2"
junitVintage = "5.14.4"
compileSdk = "36"
targetSdk = "36"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
composeUi = { module = "androidx.compose.ui:ui", version.ref = "compose" }
composeMaterial = { module = "androidx.compose.material:material", version.ref = "compose" }
composeTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
composeRuntime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
sqlDelightRuntime = { module = "app.cash.sqldelight:runtime", version.ref = "sqlDelight" }
sqlDelightAndroidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqlDelight" }
sqlDelightJvmDriver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqlDelight" }
sqlDelightCoroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqlDelight" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidExtensions" }
androidXCoreKtx = { module = "androidx.core:core-ktx", version.ref = "androidXCore" }
appCompat = { module = "androidx.appcompat:appcompat", version.ref = "appCompat" }
amviViewModel = { module = "ru.kode:amvi-viewmodel", version.ref = "amvi" }
amviCompose = { module = "ru.kode:amvi-component-compose", version.ref = "amvi" }
composeUiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
composeUiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junitVintageEngine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitVintage" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.4" }

[bundles]
coroutines = [ "coroutines-core" ]
compose = [ "composeUi", "composeMaterial", "composeTooling", "composeRuntime" ]

[plugins]
sqlDelight = { id = "app.cash.sqldelight", version.ref = "sqlDelight" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
